name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per PR (or per ref for pushes). A new push to a PR cancels that PR's
# in-flight run; pushes to master always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No npm install — the project has zero runtime or test-time deps.
      # The fake-codex shim under tests/fake-codex/ stands in for the real
      # codex CLI, so CI does not need OAuth or a ChatGPT subscription.
      - run: node --version
      - run: npm test
